codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "30...100"
  status:
    project:
      default:
        target: 30%
        threshold: 0%
        informational: false
    patch:
      default:
        target: 30%
        threshold: 0%
        informational: false

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
